name: Watch for cancellations

on:
  schedule:
    - cron: "*/10 * * * *"      # each run loops ~9 min, checking every 2 min
  workflow_dispatch:

permissions:
  contents: write               # only used for the 50-day keepalive commit

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last-seen slots
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Watch
        run: python watch.py 8.5
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save last-seen slots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
      - name: Keepalive (GitHub pauses schedules after 60 days without commits)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
